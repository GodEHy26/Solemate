services:
  api:
    build: ./backend
    environment:
      SOLEMATE_DATA_DIR: /data
      SOLEMATE_CORS_ORIGINS: '["http://localhost:8080"]'
    volumes:
      - solemate-data:/data
    ports:
      - "8000:8000"

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  solemate-data:
